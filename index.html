<style>
:root{
  --noite:#28131C;--bordo:#62071F;--malva:#B59DAF;--ceu:#9CC2EB;--cera:#FDF5ED;
  --vinho:#4B0110;--tinta:#470524;--ameixa:#3A1721;--rose:#B9697C;--rosa:#A86D79;
  --azul:#6FB8ED;--nevoa:#A3CEF1;--lavanda:#C7C1E5;--perg:#F4E3D8;--chama:#F2D997;
  --txt:#4B0110;--mut:#7d5a63;--linha:#ecdcd2;--branco:#fffdfb;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Tinos','Times New Roman',Georgia,serif;background:var(--cera);color:var(--txt);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--bordo)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
#login .l1{background:var(--perg);display:grid;place-items:center;padding:40px}
#login .l1 img{width:min(330px,70vw);height:auto;display:block}
#login .l2{background:var(--noite);color:var(--cera);display:grid;place-items:center;padding:40px}
#login form{width:min(360px,100%)}
#login h1{font-weight:400;font-size:44px;line-height:1.1;margin:0 0 6px}
#login .lema{font-style:italic;color:var(--lavanda);font-size:20px;margin:0 0 34px}
#login label{display:block;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);margin:16px 0 6px}
#login input{width:100%;padding:12px 14px;background:transparent;border:1px solid #5a3a46;border-radius:var(--r);color:var(--cera)}
#login input:focus{border-color:var(--rose);outline:none}
#login button{margin-top:26px;width:100%;padding:13px;background:var(--cera);color:var(--vinho);border:0;border-radius:var(--r);font-size:17px;cursor:pointer}
#login .erro{color:#f2a7b6;margin-top:14px;min-height:22px;font-size:15px}
@media (max-width:760px){#login{grid-template-columns:1fr}#login .l1{padding:34px 20px}#login .l1 img{width:220px}#login h1{font-size:34px}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--noite);color:var(--cera);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 0 18px}
#side .marca{display:block;text-align:center;padding:0 22px 22px;border-bottom:1px solid #3d242f}
#side .marca .bra{width:72px;height:auto;display:block;margin:0 auto 14px;border-radius:2px}
#side .marca .let{width:150px;height:auto;display:block;margin:0 auto}
#nav{padding:14px 0;overflow-y:auto;flex:1}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#d9c6cc;padding:10px 26px 10px 44px;font-size:17px;cursor:pointer;position:relative}
#nav button:hover{color:var(--cera)}
#nav button.on{color:var(--cera)}
#nav button.on::before{content:'✦';position:absolute;left:24px;top:10px;color:var(--rose);font-size:14px}
#side .rodape{padding:14px 26px 0;border-top:1px solid #3d242f;font-size:14px;color:#bba3ab}
#side .rodape b{display:block;color:var(--cera);font-weight:400;font-size:15px}
#side .rodape button{background:none;border:0;color:var(--rose);padding:6px 0 0;cursor:pointer;font-size:14px;margin-right:14px}
#main{padding:34px 40px 70px;min-width:0;max-width:1240px;width:100%}
.demo{background:var(--chama);color:var(--vinho);font-size:14px;padding:8px 14px;border-radius:var(--r);margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.demo button{background:var(--vinho);color:var(--cera);border:0;border-radius:4px;padding:4px 10px;font-size:14px;cursor:pointer}

/* mobile shell */
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:sticky;top:0;z-index:30;height:auto;flex-direction:column;padding:0;min-width:0}
  #side .marca{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;text-align:left}
  #side .marca .bra{width:30px;margin:0}
  #side .marca .let{width:118px;margin:0}
  #nav{flex:none;display:flex;overflow-x:auto;padding:0 6px;white-space:nowrap;-webkit-overflow-scrolling:touch;border-top:1px solid #3d242f;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav button{display:inline-block;width:auto;padding:11px 12px 11px 24px;font-size:15px;flex:0 0 auto}
  #nav button.on::before{left:8px;top:12px;font-size:11px}
  #side .rodape{position:absolute;right:12px;top:10px;border:0;padding:0;text-align:right}
  #side .rodape b,#side .rodape span{display:none}
  #side .rodape button{padding:4px 0;margin:0 0 0 10px}
  #main{padding:20px 14px 60px}
}

/* ---------- type ---------- */
h1.tit{font-weight:400;font-size:40px;line-height:1.1;margin:0 0 4px;color:var(--vinho)}
.sub{color:var(--mut);margin:0 0 24px;font-style:italic;font-size:17px}
h2{font-weight:400;font-size:24px;margin:30px 0 12px;color:var(--vinho)}
h3{font-weight:400;font-size:19px;margin:0 0 8px}
.eti{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rosa)}
.mut{color:var(--mut)}
.peq{font-size:14px}
@media (max-width:900px){h1.tit{font-size:31px}h2{font-size:21px}}

/* ---------- header row of page ---------- */
.topo{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.topo>div:first-child{min-width:0}
.acoes{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- buttons ---------- */
.bt{display:inline-block;background:var(--bordo);color:var(--cera);border:1px solid var(--bordo);border-radius:var(--r);padding:9px 16px;font-size:16px;cursor:pointer;line-height:1.2;text-decoration:none;white-space:nowrap}
.bt:hover{background:var(--vinho)}
.bt.sec{background:transparent;color:var(--bordo)}
.bt.sec:hover{background:var(--perg)}
.bt.mini{padding:5px 10px;font-size:14px}
.bt.zap{background:#2c6e49;border-color:#2c6e49}
.bt.perigo{background:transparent;color:#9b1b30;border-color:#d9a7b1}
.bt:disabled{opacity:.5;cursor:default}
.lk{background:none;border:0;color:var(--bordo);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* ---------- subtabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:4px 22px;border-bottom:1px solid var(--linha);margin:18px 0 22px}
.tabs button{background:none;border:0;padding:8px 0 10px;cursor:pointer;color:var(--mut);font-size:17px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--vinho);border-bottom-color:var(--bordo)}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin:6px 0 10px}
.kpi{background:var(--branco);padding:16px 18px}
.kpi span{display:block;font-size:14px;color:var(--mut)}
.kpi b{display:block;font-weight:400;font-size:27px;line-height:1.2;color:var(--vinho);margin-top:2px}
.kpi small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.kpi.escuro{background:var(--noite)}
.kpi.escuro span,.kpi.escuro small{color:#c8b1b9}
.kpi.escuro b{color:var(--cera)}
.pos{color:#2c6e49!important}.neg{color:#9b1b30!important}

/* ---------- panels ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:18px 20px;min-width:0}
.painel>h3{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vazio{color:var(--mut);font-style:italic;padding:14px 0}

/* ---------- filters ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:14px 0 16px}
.filtros label{font-size:13.5px;color:var(--mut);display:block}
.filtros input,.filtros select{padding:8px 10px;border:1px solid #dcc7bb;border-radius:var(--r);background:var(--branco);min-width:0}
.filtros .busca{flex:1 1 220px}
.filtros .busca input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #dcc7bb;background:var(--branco);border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--noite);color:var(--cera);border-color:var(--noite)}

/* ---------- tables ---------- */
.tblw{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th{text-align:left;font-weight:400;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosa);padding:11px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #f3e7df;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.clic{cursor:pointer}
table.t tr.clic:hover td{background:#fbf0e9}
table.t tfoot td{border-top:1px solid var(--linha);font-weight:700}
@media (max-width:700px){
  table.t.resp thead{display:none}
  table.t.resp,table.t.resp tbody,table.t.resp tr,table.t.resp td{display:block;width:100%}
  table.t.resp tr{padding:12px 14px;border-bottom:1px solid var(--linha);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px}
  table.t.resp td{border:0;padding:2px 0;text-align:left!important;white-space:normal;width:auto}
  table.t.resp td.prim{grid-column:1/-1}
  table.t.resp td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosa)}
  table.t.resp td.prim{font-size:17px}
  table.t.resp tfoot td{display:block}
}

/* ---------- badges ---------- */
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:13.5px;white-space:nowrap;border:1px solid transparent}
.bd.orc{background:#efecf8;color:#4a3f78}
.bd.conf{background:#e3eefb;color:#1f4d7a}
.bd.prod{background:#fbf1d6;color:#6b5210}
.bd.pronta{background:#e6f3fc;color:#1d5c80}
.bd.ent{background:var(--perg);color:var(--bordo)}
.bd.canc{background:#efe9eb;color:#8a7a80;text-decoration:line-through}
.bd.pago{background:#e3f0e8;color:#2c6e49}
.bd.parc{background:#fbf1d6;color:#6b5210}
.bd.pend{background:#fbe9ec;color:#9b1b30}
.bd.alerta{background:#fbe9ec;color:#9b1b30}
.bd.ok{background:#e3f0e8;color:#2c6e49}
.bd.nv0{background:#f3ece8;color:#8a7a80}
.bd.nv1{background:#e3eefb;color:#1f4d7a}
.bd.nv2{background:#efecf8;color:#4a3f78}
.bd.nv3{background:#f6e3e8;color:var(--bordo)}
.bd.nv4{background:var(--noite);color:var(--chama)}
.bd.luz{background:#e3eefb;color:#1f4d7a}
.bd.sombra{background:var(--ameixa);color:var(--cera)}
.bd.dual{background:linear-gradient(90deg,#e3eefb 50%,#3A1721 50%);color:var(--vinho)}

/* ---------- bars ---------- */
.barras{display:grid;gap:9px}
.barra{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:15px}
.barra .tr{height:10px;background:#f3e7df;border-radius:5px;overflow:hidden}
.barra .tr i{display:block;height:100%;background:var(--bordo);border-radius:5px}
.barra .tr i.c{background:var(--azul)}
.meses{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:190px;padding-top:10px}
.mes{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:13px;color:var(--mut)}
.mes .par{display:flex;gap:3px;align-items:flex-end;height:150px}
.mes .par i{display:block;width:16px;border-radius:3px 3px 0 0;background:var(--bordo)}
.mes .par i.l{background:var(--ceu)}
.legenda{display:flex;gap:16px;font-size:14px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- lists ---------- */
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:9px 0;border-bottom:1px solid #f3e7df;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lista li:last-child{border-bottom:0}
.lista li>span:first-child{min-width:0}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(40,19,28,.55);z-index:100;display:none;overflow-y:auto;padding:30px 14px}
#modal.on{display:block}
#modal .cx{background:var(--cera);max-width:760px;margin:0 auto;border-radius:8px;box-shadow:0 18px 50px rgba(40,19,28,.35);overflow:hidden}
#modal .cx.larga{max-width:980px}
#modal .cab{background:var(--noite);color:var(--cera);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#modal .cab h3{margin:0;font-size:22px}
#modal .cab button{background:none;border:0;color:var(--rose);font-size:26px;cursor:pointer;line-height:1;padding:0 4px}
#modal .corpo{padding:22px}
#modal .pe{padding:14px 22px 20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;border-top:1px solid var(--linha)}
#modal .pe .esq{margin-right:auto}
@media (max-width:600px){#modal{padding:0}#modal .cx{border-radius:0;min-height:100%}#modal .corpo{padding:18px 14px}#modal .pe{padding:12px 14px 18px}}

/* ---------- forms ---------- */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.f{min-width:0}
.f.w2{grid-column:span 2}
.f.full{grid-column:1/-1}
@media (max-width:520px){.f.w2{grid-column:1/-1}}
.f label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid #dcc7bb;border-radius:var(--r);background:var(--branco)}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--rose);outline:none}
.f .dica{font-size:13.5px;color:var(--mut);margin-top:4px}
.secao{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.secao h3{margin:0}
.caixa{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.nota{background:var(--perg);border-radius:var(--r);padding:12px 14px;font-size:15px;margin:10px 0}

/* line editor rows (itens/receita/consumo) */
.linhas{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:minmax(0,3fr) minmax(70px,1fr) minmax(90px,1.2fr) minmax(90px,1fr) 34px;gap:8px;align-items:center;background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:8px}
.ln.rc{grid-template-columns:minmax(0,3fr) minmax(90px,1.2fr) minmax(90px,1fr) 34px}
.ln.cs{grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(80px,1fr))}
.ln select,.ln input{width:100%;padding:8px 9px;border:1px solid #dcc7bb;border-radius:5px;background:#fff;min-width:0}
.ln .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .x{background:none;border:0;color:#9b1b30;font-size:22px;cursor:pointer;line-height:1}
.ln.lh{background:none;border:0;padding:0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rosa)}
.ln .ml{display:none;font-size:12px;color:var(--mut)}
@media (max-width:640px){
  .ln.lh{display:none}
  .ln .ml{display:block}
  .ln{grid-template-columns:1fr 1fr 30px}
  .ln>.c1{grid-column:1/3}
  .ln>.x{grid-column:3;grid-row:1}
  .ln .v{text-align:left}
  .ln:not(.rc):not(.cs)>.v{grid-column:1/-1;font-size:15px;color:var(--mut)}
  .ln.rc{grid-template-columns:1fr 1fr 30px}
  .ln.cs{grid-template-columns:1fr 1fr}
  .ln.cs>.c1{grid-column:1/-1}
}
.totais{display:grid;gap:4px;justify-content:end;text-align:right;margin-top:12px;font-size:16px}
.totais b{font-weight:400;font-size:24px;color:var(--vinho)}

/* ficha */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 18px;margin-bottom:8px}
.ficha div span{display:block;font-size:13px;color:var(--mut)}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--noite);color:var(--cera);padding:11px 18px;border-radius:var(--r);z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;font-size:15px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.erro{background:#9b1b30}
#carregando{position:fixed;inset:0;display:grid;place-items:center;background:var(--noite);color:var(--lavanda);font-style:italic;font-size:20px;z-index:300}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#side,.acoes,.filtros,.tabs,.demo{display:none!important}#app{display:block}#main{padding:0}}
.painel.vazio{padding:16px 20px}

</style>
</head>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFua214eHp3dnN1Y3hpbmhyZWd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4Njg1MTQsImV4cCI6MjEwNjQ0NDUxNH0.gtyAC887DERX9WlPieDS4U3qzdYmy6AjAxutlHJCr08';

/* ---------- listas fixas ---------- */
const ORIGENS = ['Indicação','Instagram','TikTok','Facebook','Google','Feira / evento','Loja física','Site','Outro'];
const CANAIS = ['WhatsApp','Instagram','Site','Presencial','Feira / evento','Outro'];

const LINHAS = ['Luz','Sombra','Dual'];

const ATIVA = s => !['Orçamento','Cancelada'].includes(s);

/* ---------- estado ---------- */
const S = {}; TABELAS.forEach(t => S[t] = []);
let EU = null;          // {id, nome, usuario, papel}
let PERFIS = [];
const U = {view:'painel', sub:{}, per:null, filtro:{}};
let sb = null;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (+v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const nf = (v, d = 2) => (+v || 0).toLocaleString('pt-BR', {maximumFractionDigits:d});
const pct = v => isFinite(v) ? (v * 100).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%' : '—';
function pn(s){ if (typeof s === 'number') return s; s = String(s ?? '').trim().replace(/[R$\s]/g,''); if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isFinite(n) ? n : 0; }
const r2 = v => Math.round((+v || 0) * 100) / 100;
function hoje(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDias(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
const fd = iso => iso ? String(iso).slice(0,10).split('-').reverse().join('/') : '—';
const mesNome = ym => { const [y,m] = ym.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1] + '/' + y.slice(2); };
function inicioMes(iso = hoje()){ return iso.slice(0,8) + '01'; }
function fimMes(iso = hoje()){ const d = new Date(iso.slice(0,7) + '-01T12:00:00'); d.setMonth(d.getMonth()+1); d.setDate(0); return d.toISOString().slice(0,10); }
function diasEntre(a, b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 864e5); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const byId = (t, id) => S[t].find(r => r.id === id);
const soDig = s => String(s || '').replace(/\D/g,'');
function fone(s){ const d = soDig(s); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s || ''; }
function waLink(tel, msg){ let d = soDig(tel); if (!d) return null; if (d.length <= 11) d = '55' + d; return `https://wa.me/${d}${msg ? '?text=' + encodeURIComponent(msg) : ''}`; }
const ehGestor = () => EU && EU.papel === 'gestor';
const opts = (arr, sel, vazio) => (vazio !== undefined ? `<option value="">${esc(vazio)}</option>` : '') + arr.map(o => { const [v,l] = Array.isArray(o) ? o : [o,o]; return `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const chk = id => { const e = document.getElementById(id); return !!(e && e.checked); };

function toast(msg, erro){ const t = $('#toast'); t.textContent = msg; t.className = 'on' + (erro ? ' erro' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3200); }
function falha(e){ console.error(e); toast('Não foi possível salvar: ' + (e && e.message ? e.message : e), true); }

/* ---------- camada de dados ---------- */
const DB = {
  async all(t){
    if (DEMO) return JSON.parse(localStorage.getItem(LK + t) || '[]');
    let out = [], de = 0;
    for(;;){ const {data, error} = await sb.from(t).select('*').range(de, de + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; de += 1000; }
    return out;
  },
  _grava(t){ localStorage.setItem(LK + t, JSON.stringify(S[t])); },
  async ins(t, o){
    let r;
    if (DEMO){
      r = {id: uid(), created_at: new Date().toISOString(), ...o};
      if (t === 'config') r.id = 1;
      if (t === 'vendas' && !r.numero) r.numero = Math.max(1000, ...S.vendas.map(v => +v.numero || 0)) + 1;
      S[t].push(r); this._grava(t); return r;
    }
    const {data, error} = await sb.from(t).insert(o).select().single(); if (error) throw error;
    S[t].push(data); return data;
  },
  async upd(t, id, p){
    let r;
    if (DEMO){ const i = S[t].findIndex(x => x.id === id); if (i < 0) throw new Error('registro não encontrado'); r = S[t][i] = {...S[t][i], ...p}; this._grava(t); return r; }
    const {data, error} = await sb.from(t).update(p).eq('id', id).select().single(); if (error) throw error;
    const i = S[t].findIndex(x => x.id === id); if (i >= 0) S[t][i] = data; return data;
  },
  async del(t, id){
    if (!DEMO){ const {error} = await sb.from(t).delete().eq('id', id); if (error) throw error; }
    S[t] = S[t].filter(x => x.id !== id); if (DEMO) this._grava(t);
  }
};

async function carregarTudo(){
  const res = await Promise.all(TABELAS.map(t => DB.all(t)));
  TABELAS.forEach((t, i) => S[t] = res[i]);
  if (!DEMO && ehGestor()){ const {data} = await sb.from('profiles').select('*'); PERFIS = data || []; }
}
function CFG(){ const c = S.config.find(x => x.id === 1); return Object.assign({
  margem: 0.55, taxas: {'Pix':0,'Dinheiro':0,'Cartão de crédito':0.0399,'Cartão de débito':0.0199,'Link de pagamento':0.0499,'Transferência':0},
  taxaMedia: 0.02, dias_reativar: 60}, c ? c.dados : {}); }
async function salvarCFG(p){ const atual = S.config.find(x => x.id === 1); const dados = {...(atual ? atual.dados : {}), ...p};
  if (atual) await DB.upd('config', 1, {dados}); else await DB.ins('config', {id:1, dados}); }

/* ---------- autenticação ---------- */
async function iniciar(){
  if (!DEMO){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data:{session}} = await sb.auth.getSession();
    if (!session){ mostrarLogin(); return; }
    if (!await carregarPerfil(session.user)) return;
  } else {
    EU = {id:'demo', nome:'Demonstração', usuario:'demo', papel:'gestor'};
  }
  await abrirApp();
}
async function carregarPerfil(user){
  const {data, error} = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !data){ await sb.auth.signOut(); mostrarLogin('Seu usuário existe, mas não tem perfil no sistema. Peça a um gestor para verificar.'); return false; }
  if (!data.ativo){ await sb.auth.signOut(); mostrarLogin('Seu acesso ainda não foi liberado. Peça a um gestor para ativar seu usuário.'); return false; }
  EU = data; return true;
}
function mostrarLogin(msg){
  $('#carregando').style.display = 'none'; $('#app').style.display = 'none'; $('#login').style.display = '';
  $('#lerro').textContent = msg || '';
}
async function entrar(ev){
  ev.preventDefault();
  let u = val('lu').trim().toLowerCase(); const s = val('ls');
  if (!u || !s){ $('#lerro').textContent = 'Preencha usuário e senha.'; return; }
  if (!u.includes('@')) u = u + '@' + DOMINIO_LOGIN;
  $('#lbt').disabled = true; $('#lerro').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email:u, password:s});
  $('#lbt').disabled = false;
  if (error){ $('#lerro').textContent = 'Usuário ou senha incorretos.'; return; }
  if (!await carregarPerfil(data.user)) return;
  $('#login').style.display = 'none'; await abrirApp();
}
async function sair(){ if (!DEMO) await sb.auth.signOut(); location.reload(); }

async function abrirApp(){
  $('#carregando').style.display = '';
  try { await carregarTudo(); } catch(e){ console.error(e); $('#carregando').textContent = 'Não foi possível ler o banco de dados: ' + (e.message || e) + '. Confira se o arquivo SQL foi executado no Supabase.'; return; }
  $('#carregando').style.display = 'none'; $('#login').style.display = 'none'; $('#app').style.display = '';
  $('#quem').textContent = EU.nome || EU.usuario;
  $('#papel').textContent = EU.papel === 'gestor' ? 'Gestor(a)' : 'Atendente';
  if (!U.per) U.per = {de: inicioMes(), ate: fimMes()};
  render();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && !DEMO && !$('#modal').classList.contains('on')){ try { await carregarTudo(); render(); } catch(e){} }
  });
}
async function atualizar(){ try { await carregarTudo(); render(); toast('Dados atualizados'); } catch(e){ falha(e); } }

function sub(v, s){ U.sub[v] = s; render(); }

const subAt = (v, padrao) => U.sub[v] || padrao;

function filtroPeriodo(){
  const p = U.per, h = hoje();
  const atalhos = [['mes','Este mês',inicioMes(h),fimMes(h)],['ant','Mês passado',inicioMes(addDias(inicioMes(h),-1)),fimMes(addDias(inicioMes(h),-1))],['90','90 dias',addDias(h,-89),h],['ano','Este ano',h.slice(0,4)+'-01-01',h.slice(0,4)+'-12-31'],['tudo','Tudo','2000-01-01','2099-12-31']];

/* ---------- modal ---------- */
function modal(titulo, corpo, pe, larga){
  $('#modal').innerHTML = `<div class="cx${larga ? ' larga' : ''}" role="dialog" aria-modal="true"><div class="cab"><h3>${titulo}</h3><button onclick="fechar()" aria-label="Fechar">×</button></div><div class="corpo">${corpo}</div>${pe ? `<div class="pe">${pe}</div>` : ''}</div>`;

}
function fechar(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
function confirmar(msg){ return window.confirm(msg); }
const fld = (lab, html, cls = '', dica = '') => `<div class="f ${cls}"><label>${lab}</label>${html}${dica ? `<div class="dica">${dica}</div>` : ''}</div>`;
const inp = (id, v = '', at = '') => `<input id="${id}" value="${esc(v)}" ${at}>`;
const dec = (id, v, at = '') => `<input id="${id}" inputmode="decimal" value="${v === '' || v == null ? '' : esc(String(v).replace('.',','))}" ${at}>`;

/* =====================================================================
   CÁLCULOS
   ===================================================================== */
const unid = m => (m && m.unidade) || 'un';
function custoMaterial(p){ return r2((p.receita || []).reduce((s, l) => { const m = byId('materiais', l.material_id); return s + (m ? pn(l.qtd) * (+m.custo_unit || 0) : 0); }, 0)); }
/* fator de desperdício real do produto, a partir dos lotes produzidos (custo usado / custo previsto) */
function fatorDesp(p){
  let prev = 0, real = 0;
  S.producoes.filter(x => x.produto_id === p.id).forEach(x => (x.consumo || []).forEach(c => { const cu = +c.custo_unit || 0; prev += (+c.previsto || 0) * cu; real += (+c.real || 0) * cu; }));
  return prev > 0 ? Math.max(1, real / prev) : 1;
}
function custoReal(p){ return r2(custoMaterial(p) * fatorDesp(p) + (+p.mao_obra || 0)); }
function margemAtual(p){ const c = CFG(); const pr = +p.preco || 0; if (!pr) return NaN; return (pr - custoReal(p) - pr * c.taxaMedia) / pr; }
function precoSugerido(p, margem){ const c = CFG(); const m = margem ?? c.margem; const den = 1 - m - c.taxaMedia; return den > 0 ? r2(custoReal(p) / den) : NaN; }

const pagosDe = v => S.pagamentos.filter(p => p.venda_id === v.id);
const pagoVenda = v => r2(pagosDe(v).reduce((s, p) => s + (+p.valor || 0), 0));
const saldoVenda = v => r2((+v.total || 0) - pagoVenda(v));
function statusPag(v){ if (!ATIVA(v.status)) return null; const pg = pagoVenda(v); if (pg >= (+v.total || 0) - 0.009) return 'Pago'; return pg > 0 ? 'Parcial' : 'Pendente'; }
const bdPag = v => { const s = statusPag(v); return s ? `<span class="bd ${{Pago:'pago',Parcial:'parc',Pendente:'pend'}[s]}">${s}</span>` : '<span class="mut">—</span>'; };
const bdSt = s => `<span class="bd ${STATUS_CL[s] || ''}">${esc(s)}</span>`;
const bdLinha = l => l ? `<span class="bd ${{Luz:'luz',Sombra:'sombra',Dual:'dual'}[l] || ''}">${esc(l)}</span>` : '';

function comprasCli(c){ return S.vendas.filter(v => v.cliente_id === c.id && ATIVA(v.status)).sort((a,b) => (b.data || '').localeCompare(a.data || '')); }
function metricasCli(c){
  const vs = comprasCli(c), tot = r2(vs.reduce((s, v) => s + (+v.total || 0), 0));
  const ult = vs[0] ? vs[0].data : null;
  return {n: vs.length, total: tot, ticket: vs.length ? tot / vs.length : 0, ultima: ult, dias: ult ? diasEntre(ult, hoje()) : null,
    primeira: vs.length ? vs[vs.length - 1].data : null, indicou: S.clientes.filter(x => x.indicado_por === c.id).length};
}
function nivel(n){ if (n >= 7) return [4,'VIP Acervo']; if (n >= 4) return [3,'Fiel']; if (n >= 2) return [2,'Recorrente']; if (n === 1) return [1,'Nova']; return [0,'Sem compras']; }
const bdNivel = n => { const [k,l] = nivel(n); return `<span class="bd nv${k}">${l}</span>`; };
const nomeCli = id => { const c = byId('clientes', id); return c ? c.nome : 'Cliente avulso'; };
const resumoItens = v => (v.itens || []).map(i => `${i.qtd}× ${i.nome}`).join(', ');

function resumoFin(de, ate){
  const vs = S.vendas.filter(v => ATIVA(v.status) && v.data >= de && v.data <= ate);
  const fat = vs.reduce((s, v) => s + (+v.total || 0), 0);
  const cmv = vs.reduce((s, v) => s + (+v.custo_total || 0), 0);
  const fretes = vs.reduce((s, v) => s + (+v.frete || 0), 0);
  const pgs = S.pagamentos.filter(p => p.data >= de && p.data <= ate);
  const rec = pgs.reduce((s, p) => s + (+p.valor || 0), 0);
  const taxas = pgs.reduce((s, p) => s + (+p.taxa || 0), 0);
  const gs = S.gastos.filter(g => g.data >= de && g.data <= ate);
  const compras = gs.filter(g => g.categoria === 'Compra de material').reduce((s, g) => s + (+g.valor || 0), 0);
  const desp = gs.filter(g => g.categoria !== 'Compra de material').reduce((s, g) => s + (+g.valor || 0), 0);
  const desperd = S.producoes.filter(p => p.data >= de && p.data <= ate).reduce((s, p) => s + (+p.desperdicio_custo || 0), 0);
  const bruto = fat - cmv, liq = bruto - taxas - desp;
  return {vs, n: vs.length, fat, cmv, fretes, rec, taxas, compras, desp, desperd, bruto, liq, margem: fat ? liq / fat : NaN, ticket: vs.length ? fat / vs.length : 0, caixa: rec - taxas - compras - desp};
}

/* =====================================================================
   CLIENTES
   ===================================================================== */
function vClientes(){
  const f = U.filtro.cli || (U.filtro.cli = {q:'', origem:'', nivel:''});
  const todos = S.clientes.map(c => ({c, m: metricasCli(c)}));
  const compradores = todos.filter(x => x.m.n > 0), recorr = todos.filter(x => x.m.n > 1);
  const q = f.q.toLowerCase();
  let lista = todos.filter(({c, m}) => (!q || [c.nome, c.whatsapp, c.instagram, c.email, c.bairro].join(' ').toLowerCase().includes(q) || soDig(c.whatsapp).includes(soDig(q) || '#'))
    && (!f.origem || c.origem === f.origem) && (!f.nivel || nivel(m.n)[1] === f.nivel));
  lista.sort((a, b) => b.m.total - a.m.total || a.c.nome.localeCompare(b.c.nome));
  // origem
  const porOrigem = {}; todos.forEach(({c, m}) => { const o = c.origem || 'Não informado'; porOrigem[o] = porOrigem[o] || {n:0, fat:0, rec:0}; porOrigem[o].n++; porOrigem[o].fat += m.total; if (m.n > 1) porOrigem[o].rec++; });
  const maxO = Math.max(1, ...Object.values(porOrigem).map(o => o.n));
  return `<div class="topo"><div><h1 class="tit">Clientes</h1><p class="sub">Quem guarda o acervo com a gente.</p></div>
    <div class="acoes"><button class="bt" onclick="formCliente()">Novo cliente</button></div></div>
  <div class="kpis">
    <div class="kpi"><span>Clientes cadastrados</span><b>${todos.length}</b></div>
    <div class="kpi"><span>Já compraram</span><b>${compradores.length}</b></div>
    <div class="kpi"><span>Taxa de recompra</span><b>${pct(compradores.length ? recorr.length / compradores.length : NaN)}</b><small>compraram 2 vezes ou mais</small></div>
    <div class="kpi"><span>Valor médio por cliente</span><b>${brl(compradores.length ? compradores.reduce((s, x) => s + x.m.total, 0) / compradores.length : 0)}</b></div>
  </div>
  <details class="painel" style="margin:16px 0" ${todos.length ? '' : 'open'}><summary style="cursor:pointer"><h3 style="display:inline">Como nos conheceram</h3></summary>
    <div class="barras" style="margin-top:14px">${Object.entries(porOrigem).sort((a,b) => b[1].n - a[1].n).map(([o, d]) => `<div class="barra"><span>${esc(o)}</span><span class="tr"><i style="width:${d.n / maxO * 100}%"></i></span><span class="num peq">${d.n} · ${brl(d.fat)} · ${pct(d.n ? d.rec / d.n : NaN)} voltam</span></div>`).join('') || '<div class="vazio">Cadastre clientes para ver a origem.</div>'}</div>

function filtrarCli(q){ q = q.toLowerCase(); const d = soDig(q); const sel = $('#v_cli');

  const prim = [...sel.options].find((o, i) => i > 0 && !o.hidden); if (prim && q) sel.value = prim.value; }
function toggleCliNovo(novo){ $('#cliNovo').style.display = novo ? '' : 'none'; $('#cliExist').style.display = novo ? 'none' : ''; }

function renderLinhasV(){
  $('#linhasV').innerHTML = VF.itens.map((it, i) => `<div class="ln">
    <div class="c1"><select onchange="escolheProdV(${i},this.value)">${prodOpts(it.produto_id)}</select></div>
    <div><span class="ml">Qtd</span><input inputmode="numeric" value="${it.qtd}" oninput="VF.itens[${i}].qtd=Math.max(0,Math.round(pn(this.value)));totaisV()"></div>
    <div><span class="ml">Preço un.</span><input inputmode="decimal" value="${String(it.preco).replace('.',',')}" oninput="VF.itens[${i}].preco=pn(this.value);totaisV()"></div>
    <div class="v" id="stV${i}">${brl(it.qtd * it.preco)}</div>
    <button class="x" title="Remover item" onclick="VF.itens.splice(${i},1);renderLinhasV()">×</button></div>`).join('') || '<div class="vazio">Adicione ao menos um item.</div>';

function escolheProdV(i, pid){ const p = byId('produtos', pid); VF.itens[i] = {...VF.itens[i], produto_id: pid, nome: p ? p.nome : '', preco: p ? +p.preco || 0 : 0, custo: p ? custoReal(p) : 0}; renderLinhasV(); }
function totaisV(){
  VF.itens.forEach((it, i) => { const e = document.getElementById('stV' + i); if (e) e.textContent = brl(it.qtd * it.preco); });
  const sub = VF.itens.reduce((s, it) => s + it.qtd * it.preco, 0), d = pn(val('v_desc')), fr = pn(val('v_frete'));
  const tot = r2(sub - d + fr);
  $('#totV').innerHTML = `<span class="mut">Subtotal ${brl(sub)}${d ? ' · desconto ' + brl(d) : ''}${fr ? ' · frete ' + brl(fr) : ''}</span><b>${brl(tot)}</b>`;
  const pv = document.getElementById('p_valor'); if (pv && !pv.dataset.mexido){ pv.value = String(tot).replace('.',','); pv.oninput = () => pv.dataset.mexido = 1; }
  return {sub, d, fr, tot};
}
/* aplica no estoque de velas prontas a diferença entre a versão antiga e a nova da venda */
async function estoqueVenda(antiga, nova){
  const delta = {};
  if (antiga && antiga.estoque_baixado) (antiga.itens || []).forEach(i => delta[i.produto_id] = (delta[i.produto_id] || 0) + (+i.qtd || 0));
  const baixa = ATIVA(nova.status);
  if (baixa) (nova.itens || []).forEach(i => delta[i.produto_id] = (delta[i.produto_id] || 0) - (+i.qtd || 0));
  for (const [pid, d] of Object.entries(delta)){ const p = byId('produtos', pid); if (p && d) await DB.upd('produtos', pid, {estoque: (+p.estoque || 0) + d}); }
  return baixa;
}

  try {
    let cliente_id = val('v_cli') || null;
    if (novoCli){ const c = await DB.ins('clientes', {nome: val('n_nome').trim(), whatsapp: soDig(val('n_zap')), origem: val('n_origem'), cidade: 'Brasília'}); cliente_id = c.id; }
    const antiga = id ? JSON.parse(JSON.stringify(byId('vendas', id))) : null;
    const o = {data: val('v_data') || hoje(), cliente_id, canal: val('v_canal'), status: val('v_status'), itens,
      subtotal: r2(sub), desconto: r2(d), frete: r2(fr), total: tot, custo_total: r2(itens.reduce((s, i) => s + i.qtd * (+i.custo || 0), 0)),
      entrega: val('v_ent'), data_entrega: val('v_dent') || null, endereco_entrega: val('v_endent').trim(), obs: val('v_obs').trim(), vendedor: EU.nome || EU.usuario};
    if (id) delete o.vendedor;
    o.estoque_baixado = ATIVA(o.status);
    const r = id ? await DB.upd('vendas', id, o) : await DB.ins('vendas', o);
    await estoqueVenda(antiga, o);
    if (!id && chk('v_pagar')){ const valor = pn(val('p_valor')); if (valor > 0) await gravarPagamento(r.id, valor, val('p_forma'), val('p_data')); }
    const neg = itens.map(i => byId('produtos', i.produto_id)).filter(p => p && (+p.estoque || 0) < 0);
    toast(neg.length ? `Venda salva. Atenção: estoque negativo em ${neg.map(p => p.nome).join(', ')} — registre a produção.` : 'Venda salva');
    verVenda(r.id); render();
  } catch(e){ btn.disabled = false; falha(e); }
}

      ${v.endereco_entrega || (c && c.endereco) ? `<div style="grid-column:1/-1"><span>Endereço</span>${esc(v.endereco_entrega || [c.endereco, c.bairro, c.cidade].filter(Boolean).join(' · '))}</div>` : ''}

    <div class="secao"><h3>Pagamentos</h3>${ATIVA(v.status) && sd > 0.009 ? `<button class="bt mini" onclick="formPagamento('${id}')">Registrar pagamento</button>` : ''}</div>

    ${ATIVA(v.status) ? `<p style="margin:10px 2px 0">${sd > 0.009 ? `Falta receber <b>${brl(sd)}</b>` : sd < -0.009 ? `Recebido a mais: ${brl(-sd)}` : 'Venda quitada.'}</p>` : ''}`,

}
async function mudarStatus(id, s){
  const antiga = JSON.parse(JSON.stringify(byId('vendas', id)));
  try { const nova = {...antiga, status: s}; const baixa = ATIVA(s);
    await DB.upd('vendas', id, {status: s, estoque_baixado: baixa}); await estoqueVenda(antiga, nova);
    toast('Status: ' + s); verVenda(id); render(); } catch(e){ falha(e); }
}
async function excluirVenda(id){
  const v = byId('vendas', id);
  if (!confirmar(`Excluir a venda Nº ${v.numero}? Os pagamentos dela também serão apagados e o estoque das velas volta.`)) return;
  try { for (const p of pagosDe(v)) await DB.del('pagamentos', p.id);
    if (v.estoque_baixado) await estoqueVenda(v, {status: 'Cancelada', itens: []});
    await DB.del('vendas', id); fechar(); render(); toast('Venda excluída'); } catch(e){ falha(e); }
}

async function gravarPagamento(venda_id, valor, forma, data, obs, taxa){
  const tx = taxa != null ? taxa : r2(valor * (CFG().taxas[forma] || 0));
  return DB.ins('pagamentos', {venda_id, valor: r2(valor), forma, data: data || hoje(), taxa: tx, obs: obs || '', registrado_por: EU.nome || EU.usuario});
}
function formPagamento(vid){
  const v = byId('vendas', vid), sd = Math.max(0, saldoVenda(v));
  modal(`Pagamento · venda Nº ${v.numero}`, `<p class="mut" style="margin-top:0">${esc(nomeCli(v.cliente_id))} · total ${brl(v.total)} · falta ${brl(sd)}</p>
  <div class="fg">${fld('Valor recebido (R$) *', dec('pg_valor', sd, 'oninput="taxaPg()"'))}${fld('Forma', `<select id="pg_forma" onchange="taxaPg()">${opts(FORMAS, 'Pix')}</select>`)}${fld('Data', inp('pg_data', hoje(), 'type="date"'))}
  ${fld('Taxa da maquininha / plataforma (R$)', dec('pg_taxa', ''), '', 'Calculada pelas taxas em Financeiro › Ajustes. Pode corrigir.')}
  ${fld('Observação', inp('pg_obs', '', 'placeholder="Ex.: sinal de 50%"'), 'full')}</div>`,
  `<button class="bt sec" onclick="verVenda('${vid}')">Voltar</button><button class="bt" onclick="salvarPagamento('${vid}')">Registrar pagamento</button>`);
  taxaPg();
}
function taxaPg(){ const t = r2(pn(val('pg_valor')) * (CFG().taxas[val('pg_forma')] || 0)); $('#pg_taxa').value = String(t).replace('.',','); }
async function salvarPagamento(vid){
  const valor = pn(val('pg_valor')); if (valor <= 0) return toast('Informe o valor recebido.', true);
  try { await gravarPagamento(vid, valor, val('pg_forma'), val('pg_data'), val('pg_obs').trim(), pn(val('pg_taxa'))); toast('Pagamento registrado'); verVenda(vid); render(); } catch(e){ falha(e); }
}
async function excluirPagamento(pid, vid){ if (!confirmar('Excluir este pagamento?')) return;
  try { await DB.del('pagamentos', pid); toast('Pagamento excluído'); if (vid) verVenda(vid); render(); } catch(e){ falha(e); } }

    const tot = pgs.reduce((s, p) => s + (+p.valor || 0), 0), tx = pgs.reduce((s, p) => s + (+p.taxa || 0), 0);

    <div class="kpi"><span>Por forma</span><small style="font-size:14.5px;color:var(--txt)">${Object.entries(porForma).map(([k, d]) => `${esc(k)}: ${brl(d.v)}`).join('<br>') || '—'}</small></div></div>`;
    html += pgs.length ? `<div class="tblw"><table class="t resp"><thead><tr><th>Data</th><th>Venda</th><th>Cliente</th><th>Forma</th><th class="n">Valor</th><th class="n">Taxa</th><th></th></tr></thead><tbody>
      ${pgs.map(p => { const v = byId('vendas', p.venda_id); return `<tr><td class="prim">${fd(p.data)}</td><td data-l="Venda">${v ? `<button class="lk" onclick="verVenda('${v.id}')">Nº ${v.numero}</button>` : '—'}</td><td data-l="Cliente">${v ? esc(nomeCli(v.cliente_id)) : '—'}</td><td data-l="Forma">${esc(p.forma)}</td><td class="n" data-l="Valor">${brl(p.valor)}</td><td class="n" data-l="Taxa">${brl(p.taxa)}</td><td>${ehGestor() ? `<button class="lk peq" onclick="excluirPagamento('${p.id}')">excluir</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="painel vazio">Nenhum pagamento neste período.</div>';
  }
  return html;
}

function renderReceita(){
  const mats = S.materiais.slice().sort((a,b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome)).map(m => [m.id, `${m.nome} (${unid(m)})`]);

function calcProd(){
  if (!PF) return;
  PF.receita.forEach((l, i) => { const m = byId('materiais', l.material_id), e = document.getElementById('rc' + i); if (e) e.textContent = m ? `${nf(l.qtd)} ${unid(m)} · ${brl(pn(l.qtd) * (+m.custo_unit || 0))}` : ''; });
  const tmp = {id: PF.id, receita: PF.receita, preco: pn(val('p_preco')), mao_obra: document.getElementById('p_mo') ? pn(val('p_mo')) : (PF.id ? +byId('produtos', PF.id).mao_obra || 0 : 0)};
  const cm = custoMaterial(tmp), fd_ = fatorDesp(tmp), cr = custoReal(tmp), mg = margemAtual(tmp), sug = precoSugerido(tmp);
  $('#calcP').innerHTML = ehGestor() ? `<div class="ficha" style="margin:0">
    <div><span>Custo de material</span><b style="font-weight:400;font-size:20px">${brl(cm)}</b></div>

    <div><span>Custo real por vela</span><b style="font-weight:400;font-size:20px">${brl(cr)}</b></div>
    <div><span>Margem com o preço atual</span><b style="font-weight:400;font-size:20px" class="${mg < 0.3 ? 'neg' : ''}">${pct(mg)}</b></div>
    <div><span>Preço sugerido (margem ${pct(CFG().margem)})</span>${isFinite(sug) ? `<button class="lk" onclick="document.getElementById('p_preco').value='${String(sug).replace('.',',')}';calcProd()">${brl(sug)} · usar</button>` : '—'}</div></div>` : `<span class="mut">Custo de material: ${brl(cm)}</span>`;

function calcEntrada(id){
  const m = byId('materiais', id), q = pn(val('e_qtd')) * pn(val('e_fat') || 1), v = pn(val('e_valor'));
  const nq = Math.max(0, +m.qtd || 0) + q, nc = nq ? (Math.max(0, +m.qtd || 0) * (+m.custo_unit || 0) + v) / nq : 0;
  $('#e_res').innerHTML = q ? `Entram <b>${nf(q)} ${unid(m)}</b>${v ? ` a ${brl4(v / q)}/${unid(m)}` : ''}. Estoque fica com ${nf((+m.qtd || 0) + q)} ${unid(m)}${v ? `, custo médio ${brl4(nc)}/${unid(m)}` : ''}.` : '<span class="mut">Informe a quantidade e o valor.</span>';
}
async function salvarEntrada(id){

  if (q <= 0) return toast('Informe a quantidade comprada.', true);

  try {
    const mv = await DB.ins('movimentos', {data: val('e_data') || hoje(), material_id: id, tipo: 'entrada', qtd: q, valor: v, obs: val('e_forn').trim()});
    await DB.upd('materiais', id, {qtd: (+m.qtd || 0) + q, custo_unit: v ? Math.round(nc * 1e6) / 1e6 : m.custo_unit, fornecedor: val('e_forn').trim() || m.fornecedor});

  } catch(e){ falha(e); }
}

function montaConsumo(soQtd){
  const p = byId('produtos', val('pr_prod')), n = Math.round(pn(val('pr_qtd')));
  if (!p){ $('#linhasPr').innerHTML = '<div class="vazio">Escolha o produto e a quantidade.</div>'; return; }
  if (!(p.receita || []).length){ $('#linhasPr').innerHTML = '<div class="nota">Este produto não tem receita. Edite no Catálogo e informe o material por vela.</div>'; return; }
  const ant = {}; PR.consumo.forEach(c => ant[c.material_id] = c);
  PR.consumo = p.receita.map(l => { const m = byId('materiais', l.material_id); const prev = r2(pn(l.qtd) * n); const a = ant[l.material_id];
    return {material_id: l.material_id, nome: m ? m.nome : '(material removido)', unidade: unid(m), custo_unit: m ? +m.custo_unit || 0 : 0, previsto: prev,
      real: a && a.editado ? a.real : prev, editado: a && a.editado}; });
  $('#linhasPr').innerHTML = PR.consumo.map((c, i) => { const m = byId('materiais', c.material_id); return `<div class="ln cs">
    <div class="c1">${esc(c.nome)}<br><span class="mut peq">tem ${m ? nf(m.qtd) : 0} ${c.unidade}</span></div>
    <div><span class="ml">Pela receita</span>${nf(c.previsto)} ${c.unidade}</div>
    <div><span class="ml">Usado de verdade</span><input inputmode="decimal" value="${String(c.real).replace('.',',')}" oninput="PR.consumo[${i}].real=pn(this.value);PR.consumo[${i}].editado=1;resConsumo()"></div>
    <div id="cd${i}"></div><div class="v" id="cc${i}"></div></div>`; }).join('');
  resConsumo();
}
function resConsumo(){
  const n = Math.round(pn(val('pr_qtd'))); let ct = 0, dc = 0;
  PR.consumo.forEach((c, i) => { const w = c.real - c.previsto; ct += c.real * c.custo_unit; dc += Math.max(0, w) * c.custo_unit;
    $('#cd' + i).innerHTML = `<span class="ml">Desperdício</span><span class="${w > 0 ? 'neg' : ''}">${nf(w)} ${c.unidade}${c.real > 0 && w ? ` (${pct(w / c.real)})` : ''}</span>`;
    $('#cc' + i).textContent = brl(c.real * c.custo_unit); });
  const box = $('#pr_res'); box.style.display = n ? '' : 'none';
  box.innerHTML = `<div class="ficha" style="margin:0"><div><span>Custo do lote</span>${brl(ct)}</div><div><span>Custo por vela</span>${brl(n ? ct / n : 0)}</div><div><span>Perdido em desperdício</span><span class="${dc > 0 ? 'neg' : ''}">${brl(dc)}</span></div></div>`;
  return {ct, dc};
}
async function salvarProducao(){
  const p = byId('produtos', val('pr_prod')), n = Math.round(pn(val('pr_qtd')));
  if (!p) return toast('Escolha o produto.', true);
  if (n <= 0) return toast('Informe quantas velas foram produzidas.', true);
  if (!PR.consumo.length) return toast('Este produto não tem receita.', true);
  const {ct, dc} = resConsumo(); $('#btPr').disabled = true;
  try {
    const consumo = PR.consumo.map(c => ({material_id: c.material_id, nome: c.nome, unidade: c.unidade, custo_unit: c.custo_unit, previsto: c.previsto, real: c.real}));
    const r = await DB.ins('producoes', {data: val('pr_data') || hoje(), produto_id: p.id, produto_nome: p.nome, qtd: n, consumo, custo_total: r2(ct), desperdicio_custo: r2(dc), obs: val('pr_obs').trim()});
    for (const c of consumo){ const m = byId('materiais', c.material_id); if (!m || !c.real) continue;
      await DB.upd('materiais', m.id, {qtd: r2((+m.qtd || 0) - c.real)});
      await DB.ins('movimentos', {data: r.data, material_id: m.id, tipo: 'producao', qtd: -c.real, valor: r2(c.real * c.custo_unit), obs: `${n}× ${p.nome}`, producao_id: r.id}); }
    await DB.upd('produtos', p.id, {estoque: (+p.estoque || 0) + n});
    const neg = consumo.filter(c => { const m = byId('materiais', c.material_id); return m && +m.qtd < 0; });
    fechar(); U.sub.estoque = 'producao'; render(); toast(neg.length ? `Lote registrado. Estoque negativo em ${neg.map(c => c.nome).join(', ')} — registre a entrada desses materiais.` : `Lote registrado: +${n} velas`);
  } catch(e){ $('#btPr').disabled = false; falha(e); }
}
function verProducao(id){
  const p = S.producoes.find(x => x.id === id), prod = byId('produtos', p.produto_id);
  modal(`Lote · ${esc(prod ? prod.nome : p.produto_nome)}`, `<div class="ficha"><div><span>Data</span>${fd(p.data)}</div><div><span>Velas</span>${p.qtd}</div><div><span>Custo do lote</span>${brl(p.custo_total)}</div><div><span>Custo por vela</span>${brl(p.qtd ? p.custo_total / p.qtd : 0)}</div><div><span>Desperdício</span>${brl(p.desperdicio_custo)}</div>${p.obs ? `<div style="grid-column:1/-1"><span>Observações</span>${esc(p.obs)}</div>` : ''}</div>
  <div class="tblw" style="margin-top:12px"><table class="t resp"><thead><tr><th>Material</th><th class="n">Pela receita</th><th class="n">Usado</th><th class="n">Desperdício</th><th class="n">%</th></tr></thead><tbody>
  ${(p.consumo || []).map(c => `<tr><td class="prim">${esc(c.nome)}</td><td class="n" data-l="Pela receita">${nf(c.previsto)} ${c.unidade}</td><td class="n" data-l="Usado">${nf(c.real)} ${c.unidade}</td><td class="n" data-l="Desperdício">${nf(c.real - c.previsto)} ${c.unidade}</td><td class="n" data-l="%">${c.real ? pct((c.real - c.previsto) / c.real) : '—'}</td></tr>`).join('')}</tbody></table></div>`,
  `${ehGestor() ? `<button class="bt perigo esq" onclick="excluirProducao('${id}')">Excluir lote e estornar</button>` : ''}<button class="bt sec" onclick="fechar()">Fechar</button>`, true);
}
async function excluirProducao(id){
  const p = S.producoes.find(x => x.id === id);
  if (!confirmar('Excluir este lote? Os materiais voltam para o estoque e as velas saem do estoque de prontas.')) return;
  try { for (const c of p.consumo || []){ const m = byId('materiais', c.material_id); if (m) await DB.upd('materiais', m.id, {qtd: r2((+m.qtd || 0) + (+c.real || 0))}); }
    for (const mv of S.movimentos.filter(x => x.producao_id === id)) await DB.del('movimentos', mv.id);
    const prod = byId('produtos', p.produto_id); if (prod) await DB.upd('produtos', prod.id, {estoque: (+prod.estoque || 0) - (+p.qtd || 0)});
    await DB.del('producoes', id); fechar(); render(); toast('Lote excluído e estoque estornado'); } catch(e){ falha(e); }
}

function finResumo(){
  const r = resumoFin(U.per.de, U.per.ate);
  // últimos 6 meses até o fim do período
  const meses = []; let d = inicioMes(U.per.ate > hoje() ? hoje() : U.per.ate);
  for (let i = 0; i < 6; i++){ meses.unshift(d.slice(0,7)); d = inicioMes(addDias(d, -1)); }
  const serie = meses.map(m => ({m, ...resumoFin(m + '-01', fimMes(m + '-01'))}));
  const mx = Math.max(1, ...serie.map(s => Math.max(s.fat, s.liq)));
  // por produto
  const prod = {}; r.vs.forEach(v => (v.itens || []).forEach(i => { const k = i.produto_id || i.nome; prod[k] = prod[k] || {nome: i.nome, q: 0, rec: 0, custo: 0}; prod[k].q += +i.qtd || 0; prod[k].rec += (+i.qtd || 0) * (+i.preco || 0); prod[k].custo += (+i.qtd || 0) * (+i.custo || 0); }));
  const gcat = {}; S.gastos.filter(g => noPer(g.data)).forEach(g => gcat[g.categoria] = (gcat[g.categoria] || 0) + (+g.valor || 0));
  const mg = Math.max(1, ...Object.values(gcat));
  const porOrig = {}; r.vs.forEach(v => { const c = byId('clientes', v.cliente_id); const o = c ? (c.origem || 'Não informado') : 'Cliente avulso'; porOrig[o] = (porOrig[o] || 0) + (+v.total || 0); });
  const mo = Math.max(1, ...Object.values(porOrig));
  return `<div class="filtros">${filtroPeriodo()}</div>
  <h2 style="margin-top:6px">Resultado</h2>
  <div class="kpis">
    <div class="kpi escuro"><span>Faturamento</span><b>${brl(r.fat)}</b><small>${r.n} vendas · ticket ${brl(r.ticket)}</small></div>
    <div class="kpi"><span>Custo dos produtos vendidos</span><b>${brl(r.cmv)}</b><small>material + desperdício + mão de obra</small></div>
    <div class="kpi"><span>Lucro bruto</span><b>${brl(r.bruto)}</b><small>${pct(r.fat ? r.bruto / r.fat : NaN)} do faturamento</small></div>
    <div class="kpi"><span>Taxas de pagamento</span><b>${brl(r.taxas)}</b></div>
    <div class="kpi"><span>Despesas operacionais</span><b>${brl(r.desp)}</b><small>gastos, exceto compra de material</small></div>
    <div class="kpi escuro"><span>Lucro líquido</span><b class="${r.liq < 0 ? 'neg' : ''}">${brl(r.liq)}</b><small>margem ${pct(r.margem)}</small></div>
  </div>
  <h2>Caixa</h2>
  <div class="kpis">
    <div class="kpi"><span>Recebido</span><b>${brl(r.rec)}</b></div>
    <div class="kpi"><span>Compras de material</span><b>${brl(r.compras)}</b></div>
    <div class="kpi"><span>Despesas + taxas</span><b>${brl(r.desp + r.taxas)}</b></div>
    <div class="kpi"><span>Saldo do caixa</span><b class="${r.caixa < 0 ? 'neg' : 'pos'}">${brl(r.caixa)}</b><small>recebido − tudo que saiu</small></div>
    <div class="kpi"><span>Perdido em desperdício</span><b>${brl(r.desperd)}</b><small>na produção do período</small></div>
  </div>
  <p class="mut peq">O lucro usa o custo das velas vendidas; o caixa usa o dinheiro que entrou e saiu. Comprar muito material num mês reduz o caixa, mas não o lucro.</p>
  <div class="cols" style="margin-top:20px">
    <div class="painel"><h3>Últimos 6 meses</h3>
      <div class="meses">${serie.map(s => `<div class="mes"><div class="par"><i style="height:${Math.max(2, s.fat / mx * 150)}px" title="Faturamento ${brl(s.fat)}"></i><i class="l" style="height:${Math.max(2, Math.max(0, s.liq) / mx * 150)}px" title="Lucro ${brl(s.liq)}"></i></div>${mesNome(s.m)}</div>`).join('')}</div>
      <div class="legenda"><span><i style="background:var(--bordo)"></i>Faturamento</span><span><i style="background:var(--ceu)"></i>Lucro líquido</span></div></div>
    <div class="painel"><h3>Gastos por categoria</h3>${Object.keys(gcat).length ? `<div class="barras">${Object.entries(gcat).sort((a,b) => b[1] - a[1]).map(([k, v]) => `<div class="barra"><span>${esc(k)}</span><span class="tr"><i style="width:${v / mg * 100}%"></i></span><span class="num peq">${brl(v)}</span></div>`).join('')}</div>` : '<div class="vazio">Nenhum gasto no período.</div>'}</div>
    <div class="painel"><h3>Faturamento por origem do cliente</h3>${Object.keys(porOrig).length ? `<div class="barras">${Object.entries(porOrig).sort((a,b) => b[1] - a[1]).map(([k, v]) => `<div class="barra"><span>${esc(k)}</span><span class="tr"><i class="c" style="width:${v / mo * 100}%"></i></span><span class="num peq">${brl(v)}</span></div>`).join('')}</div>` : '<div class="vazio">Sem vendas no período.</div>'}</div>
  </div>
  <h2>Por produto</h2>
  ${Object.keys(prod).length ? `<div class="tblw"><table class="t resp"><thead><tr><th>Produto</th><th class="n">Vendidas</th><th class="n">Receita</th><th class="n">Custo</th><th class="n">Lucro bruto</th><th class="n">Margem</th></tr></thead><tbody>
  ${Object.values(prod).sort((a,b) => (b.rec - b.custo) - (a.rec - a.custo)).map(p => `<tr><td class="prim">${esc(p.nome)}</td><td class="n" data-l="Vendidas">${p.q}</td><td class="n" data-l="Receita">${brl(p.rec)}</td><td class="n" data-l="Custo">${brl(p.custo)}</td><td class="n" data-l="Lucro bruto">${brl(p.rec - p.custo)}</td><td class="n" data-l="Margem">${pct(p.rec ? (p.rec - p.custo) / p.rec : NaN)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="painel vazio">Sem vendas no período.</div>'}`;
}

  ${ps.map(p => `<tr><td class="prim">${esc(p.nome || '—')}${p.id === EU.id ? ' <span class="mut peq">(você)</span>' : ''}</td><td data-l="Usuário">${esc(p.usuario || '')}</td><td data-l="Acesso">${p.papel === 'gestor' ? 'Gestor(a)' : 'Atendente'}</td><td>${p.ativo ? '<span class="bd ok">Ativo</span>' : '<span class="bd pend">Sem acesso</span>'}</td><td><button class="bt sec mini" onclick="formUsuario('${p.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}
function formUsuario(id){
  const p = id ? PERFIS.find(x => x.id === id) : {papel: 'atendente', ativo: true};
  modal(id ? 'Editar usuário' : 'Novo usuário', `<div class="fg">${fld('Nome *', inp('u_nome', p.nome))}
    ${id ? fld('Usuário', `<input value="${esc(p.usuario)}" disabled>`) : fld('Usuário para login *', inp('u_user', '', 'autocapitalize="none" placeholder="Ex.: ana"'), '', 'Só letras minúsculas, números, ponto ou traço.')}
    ${id ? '' : fld('Senha inicial *', inp('u_senha', '', 'type="text" placeholder="mínimo 6 caracteres"'), '', 'A pessoa pode trocar depois em "Minha senha".')}
    ${fld('Acesso', `<select id="u_papel" ${id === EU.id ? 'disabled' : ''}>${opts([['atendente','Atendente'],['gestor','Gestor(a)']], p.papel)}</select>`)}
    ${id && id !== EU.id ? fld('Situação', `<select id="u_ativo">${opts([['1','Ativo'],['0','Sem acesso (bloqueado)']], p.ativo ? '1' : '0')}</select>`) : ''}</div>`,
  `<button class="bt sec" onclick="fechar()">Cancelar</button><button class="bt" id="btU" onclick="salvarUsuario('${id || ''}')">Salvar usuário</button>`);
}
async function salvarUsuario(id){
  const nome = val('u_nome').trim(); if (!nome) return toast('Informe o nome.', true);
  try {
    if (id){ const patch = {nome}; if (id !== EU.id){ patch.papel = val('u_papel'); patch.ativo = val('u_ativo') === '1'; }
      const {error} = await sb.from('profiles').update(patch).eq('id', id); if (error) throw error; }
    else {
      const usuario = val('u_user').trim().toLowerCase(), senha = val('u_senha');
      if (!/^[a-z0-9._-]{2,}$/.test(usuario)) return toast('Usuário inválido. Use letras minúsculas, números, ponto ou traço.', true);
      if (senha.length < 6) return toast('A senha precisa ter ao menos 6 caracteres.', true);
      $('#btU').disabled = true;
      const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'vsp-tmp'}});
      const {data, error} = await tmp.auth.signUp({email: usuario + '@' + DOMINIO_LOGIN, password: senha, options: {data: {nome, usuario}}});
      if (error) throw new Error(/registered/i.test(error.message) ? 'esse usuário já existe' : error.message);
      if (!data.user || (data.user.identities && !data.user.identities.length)) throw new Error('esse usuário já existe');
      const {error: e2} = await sb.from('profiles').update({nome, usuario, papel: val('u_papel'), ativo: true}).eq('id', data.user.id); if (e2) throw e2;
    }
    const {data} = await sb.from('profiles').select('*'); PERFIS = data || [];
    if (id === EU.id) { EU.nome = nome; $('#quem').textContent = nome; }
    fechar(); render(); toast('Usuário salvo');
  } catch(e){ const b = $('#btU'); if (b) b.disabled = false; falha(e); }
}
function formSenha(){
  if (DEMO) return toast('No modo demonstração não há senha.');
  modal('Minha senha', `<div class="fg">${fld('Nova senha', inp('s1', '', 'type="password" autocomplete="new-password"'))}${fld('Repita a nova senha', inp('s2', '', 'type="password" autocomplete="new-password"'))}</div>`,
  `<button class="bt sec" onclick="fechar()">Cancelar</button><button class="bt" onclick="salvarSenha()">Trocar senha</button>`);
}
async function salvarSenha(){
  const a = val('s1'), b = val('s2'); if (a.length < 6) return toast('A senha precisa ter ao menos 6 caracteres.', true); if (a !== b) return toast('As senhas não conferem.', true);
  const {error} = await sb.auth.updateUser({password: a}); if (error) return falha(error); fechar(); toast('Senha alterada');
}
